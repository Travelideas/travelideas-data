<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travelideas × KKday｜動態優惠預覽</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#19a7b4;--bg:#f7f9fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;line-height:1.7}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 60px}.head{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px}.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--brand);font-weight:700}.head h1{font-size:30px;line-height:1.3;margin:4px 0 8px}.head p{margin:0;color:#4b5563}.statusbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:#fff}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer;font-size:14px}.tab.active{background:#111;color:#fff;border-color:#111}.panel{display:none}.panel.active{display:block}
.section{font-size:21px;font-weight:800;margin:26px 0 10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.title{font-size:20px;font-weight:800}.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;height:max-content}.date{font-size:14px;color:var(--muted);margin-top:4px}.offer{font-size:17px;margin-top:10px}.code{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;background:#fafafa;border:1px dashed #c7cdd4;border-radius:10px}.code b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em}.copy{margin-left:auto;border:0;border-radius:8px;padding:7px 10px;cursor:pointer}.note{font-size:14px;color:#4b5563;margin-top:10px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-block;text-decoration:none;padding:9px 14px;border-radius:9px;border:1px solid #111;color:#111}.btn.primary{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.product img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.product-body{padding:15px}.product .title{font-size:17px}.price{font-size:13px;color:var(--muted);margin-top:5px}.cardrow{display:grid;grid-template-columns:180px 1fr;gap:12px}.scope{font-weight:800}.empty,.err{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:22px;color:var(--muted)}.foot{margin-top:24px;font-size:12px;color:var(--muted)}
@media(max-width:700px){.head h1{font-size:24px}.title{font-size:18px}.grid{grid-template-columns:1fr}.cardrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="eyebrow">Travelideas Data Hub · Mirror</div>
    <h1>KKday 最新優惠資料庫預覽</h1>
    <p>內部 Mirror：同時讀取活動、熱門商品、信用卡／支付三份 JSON，用來檢查資料與版面。</p>
    <div class="statusbar">
      <span class="pill">CID 5149</span>
      <span class="pill" id="campaignCount">活動 —</span>
      <span class="pill" id="productCount">商品 —</span>
      <span class="pill" id="cardCount">信用卡 —</span>
      <span class="pill" id="updated">最後更新：—</span>
    </div>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="campaigns">活動優惠</button>
    <button class="tab" data-tab="products">熱門商品</button>
    <button class="tab" data-tab="cards">信用卡／支付</button>
  </nav>
  <main>
    <section class="panel active" id="campaigns"><div class="empty">正在讀取活動…</div></section>
    <section class="panel" id="products"><div class="empty">正在讀取商品…</div></section>
    <section class="panel" id="cards"><div class="empty">正在讀取信用卡優惠…</div></section>
  </main>
  <div class="foot" id="source"></div>
</div>
<script>
(function(){
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const date=s=>s?new Date(s+'T00:00:00+08:00'):null;
  function status(x){const n=new Date(),s=date(x.start),e=x.end?new Date(x.end+'T23:59:59+08:00'):null;if(s&&n<s)return'即將開始';if(e&&n>e)return'已結束';return'進行中'}
  function codeBox(code){return code?`<div class="code">折扣碼 <b>${esc(code)}</b><button class="copy" data-code="${esc(code)}">複製</button></div>`:''}
  function campaignCard(x){return `<article class="card"><div class="top"><div><div class="title">${esc(x.title)}</div><div class="date">活動期間：${esc(x.start||'—')} ～ ${esc(x.end||'—')}</div></div><span class="badge">${esc(status(x))}</span></div><div class="offer">${esc(x.offer)}</div>${codeBox(x.code)}<div class="note">${esc(x.note||'')}</div><div class="actions"><a class="btn primary" href="${esc(x.affiliate_url)}" target="_blank" rel="nofollow sponsored noopener">立即前往 KKday</a><a class="btn" href="${esc(x.source_url)}" target="_blank" rel="noopener">資料來源</a></div></article>`}
  function productCard(x){const img=x.image?`<img src="${esc(x.image)}" alt="" loading="lazy">`:'';const price=x.price_ref?`參考客單：約 NT$${Number(x.price_ref).toLocaleString()}`:'';return `<article class="product">${img}<div class="product-body"><div class="title">${esc(x.title)}</div>${price?`<div class="price">${price}</div>`:''}<div class="note">${esc(x.note||'')}</div><div class="actions"><a class="btn primary" href="${esc(x.url)}" target="_blank" rel="nofollow sponsored noopener">看商品</a></div></div></article>`}
  function cardOffer(x){return `<article class="card"><div class="cardrow"><div><div class="scope">${esc(x.scope)}</div><div class="date">${esc(x.start||'—')} ～ ${esc(x.end||'—')}</div></div><div><div class="offer">${esc(x.benefit)}</div>${codeBox(x.code)}<div class="actions"><a class="btn" href="${esc(x.url)}" target="_blank" rel="nofollow sponsored noopener">活動頁</a></div></div></div></article>`}
  function bindCopy(){document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.code);const t=b.textContent;b.textContent='已複製';setTimeout(()=>b.textContent=t,1000)}catch(e){prompt('複製折扣碼：',b.dataset.code)}})}
  Promise.all(['campaigns.json','products.json','credit-cards.json'].map(u=>fetch(u+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' HTTP '+r.status);return r.json()})))
    .then(([c,p,k])=>{
      const campaigns=(c.items||[]).slice().sort((a,b)=>(b.priority||0)-(a.priority||0));
      const cg={};campaigns.forEach(x=>(cg[x.category]||(cg[x.category]=[])).push(x));
      document.getElementById('campaigns').innerHTML=Object.keys(cg).map(g=>`<div class="section">${esc(g)} · ${cg[g].length}</div>${cg[g].map(campaignCard).join('')}`).join('')||'<div class="empty">目前沒有活動。</div>';
      const products=p.items||[],pg={};products.forEach(x=>(pg[x.category]||(pg[x.category]=[])).push(x));
      document.getElementById('products').innerHTML=Object.keys(pg).map(g=>`<div class="section">${esc(g)} · ${pg[g].length}</div><div class="grid">${pg[g].map(productCard).join('')}</div>`).join('')||'<div class="empty">目前沒有商品。</div>';
      const cards=(k.items||[]).filter(x=>!x.end||new Date(x.end+'T23:59:59+08:00')>=new Date());
      document.getElementById('cards').innerHTML=`<div class="section">有效／即將開始 · ${cards.length}</div>${cards.map(cardOffer).join('')}`||'<div class="empty">目前沒有信用卡優惠。</div>';
      document.getElementById('campaignCount').textContent='活動 '+campaigns.length+' 筆';
      document.getElementById('productCount').textContent='商品 '+products.length+' 筆';
      document.getElementById('cardCount').textContent='信用卡 '+cards.length+' 筆';
      document.getElementById('updated').textContent='最後更新：'+(c.updated_at||'—');
      document.getElementById('source').innerHTML=`來源：<a href="${esc(c.source?.url||'#')}" target="_blank" rel="noopener">${esc(c.source?.name||'KKpartners')}</a> · Source commit ${esc(c.source?.source_commit||'—')}`;
      bindCopy();
    }).catch(e=>{console.error(e);document.querySelectorAll('.panel').forEach(x=>x.innerHTML='<div class="err">資料讀取失敗，請檢查 JSON。</div>')});
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});
})();
</script>
</body>
</html>
