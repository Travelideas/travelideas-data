<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KKday 最新優惠・折扣碼・熱門商品｜里程家 Travelideas</title>
<meta name="description" content="整理 KKday 最新優惠、折扣碼、熱門旅遊商品與信用卡回饋，方便快速找到適合的優惠。">
<meta name="robots" content="noindex,nofollow">
<style>
:root{--ink:#172033;--muted:#667085;--line:#e8ebef;--brand:#12a7b5;--brand2:#0e7e89;--bg:#f7f9fb;--soft:#eef9fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;line-height:1.65}
a{color:inherit}.wrap{max-width:1060px;margin:0 auto;padding:24px 16px 56px}.hero{background:linear-gradient(135deg,#fff 0%,#f0fbfc 100%);border:1px solid var(--line);border-radius:22px;padding:28px 26px;box-shadow:0 8px 30px rgba(20,41,61,.05)}.brand{font-size:13px;letter-spacing:.08em;color:var(--brand2);font-weight:800}.hero h1{font-size:32px;line-height:1.28;margin:5px 0 8px}.hero p{margin:0;color:#475467;max-width:760px}.updated{font-size:12px;color:var(--muted);margin-top:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;cursor:pointer;font-size:14px;font-weight:700}.tab.active{background:var(--brand2);color:#fff;border-color:var(--brand2)}.panel{display:none}.panel.active{display:block}.section{font-size:21px;font-weight:850;margin:28px 0 10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 16px rgba(16,24,40,.035)}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.title{font-size:20px;font-weight:850}.badge{font-size:12px;background:var(--soft);color:var(--brand2);border-radius:999px;padding:5px 10px;height:max-content}.date{font-size:13px;color:var(--muted);margin-top:3px}.offer{font-size:17px;margin-top:10px}.code{display:flex;align-items:center;gap:8px;margin-top:12px;padding:11px 12px;background:#fafafa;border:1px dashed #b9c0c9;border-radius:10px}.code b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em}.copy{margin-left:auto;border:0;background:#eef1f4;border-radius:8px;padding:7px 10px;cursor:pointer}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-block;text-decoration:none;padding:9px 14px;border-radius:9px;border:1px solid #1f2937;color:#1f2937;font-weight:700}.btn.primary{background:#1f2937;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.product{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(16,24,40,.035)}.product img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.product-body{padding:15px}.product .title{font-size:17px}.price{font-size:13px;color:var(--muted);margin-top:5px}.note{font-size:14px;color:#475467;margin-top:8px}.cardrow{display:grid;grid-template-columns:190px 1fr;gap:14px}.scope{font-weight:850}.empty,.err{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:22px;color:var(--muted)}.disclaimer{margin-top:28px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12px}
@media(max-width:700px){.hero{padding:22px 18px}.hero h1{font-size:25px}.title{font-size:18px}.grid{grid-template-columns:1fr}.cardrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="brand">里程家 Travelideas</div>
    <h1>KKday 最新優惠整理</h1>
    <p>折扣碼、熱門商品、信用卡優惠一次整理。活動與名額可能隨時調整，實際優惠以 KKday 結帳頁顯示為準。</p>
    <div class="updated" id="updated">最後更新：—</div>
  </header>

  <nav class="tabs" aria-label="KKday優惠分類">
    <button class="tab active" data-tab="campaigns">活動優惠</button>
    <button class="tab" data-tab="products">熱門商品</button>
    <button class="tab" data-tab="cards">信用卡／支付</button>
  </nav>

  <main>
    <section class="panel active" id="campaigns"><div class="empty">正在讀取最新優惠…</div></section>
    <section class="panel" id="products"><div class="empty">正在讀取熱門商品…</div></section>
    <section class="panel" id="cards"><div class="empty">正在讀取信用卡優惠…</div></section>
  </main>

  <div class="disclaimer">提醒：折扣碼、優惠名額、適用商品與付款條件可能變動，請以 KKday 實際結帳頁面為準。部分連結為合作推廣連結。</div>
</div>
<script>
(function(){
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const now=()=>new Date();
  const start=s=>s?new Date(s+'T00:00:00+08:00'):null;
  const end=s=>s?new Date(s+'T23:59:59+08:00'):null;
  const active=x=>!x.end||end(x.end)>=now();
  function status(x){const n=now(),s=start(x.start),e=end(x.end);if(s&&n<s)return'即將開始';if(e&&n>e)return'已結束';return'進行中'}
  function codeBox(code){return code?`<div class="code">折扣碼 <b>${esc(code)}</b><button class="copy" data-code="${esc(code)}">複製</button></div>`:''}
  function campaignCard(x){return `<article class="card"><div class="top"><div><div class="title">${esc(x.title)}</div><div class="date">活動期間：${esc(x.start||'—')} ～ ${esc(x.end||'—')}</div></div><span class="badge">${esc(status(x))}</span></div><div class="offer">${esc(x.offer)}</div>${codeBox(x.code)}<div class="actions"><a class="btn primary" href="${esc(x.affiliate_url)}" target="_blank" rel="nofollow sponsored noopener">查看活動</a></div></article>`}
  function productCard(x){const img=x.image?`<img src="${esc(x.image)}" alt="${esc(x.title)}" loading="lazy">`:'';const price=x.price_ref?`參考價格：約 NT$${Number(x.price_ref).toLocaleString()}`:'';return `<article class="product">${img}<div class="product-body"><div class="title">${esc(x.title)}</div>${price?`<div class="price">${price}</div>`:''}${x.note?`<div class="note">${esc(x.note)}</div>`:''}<div class="actions"><a class="btn primary" href="${esc(x.url)}" target="_blank" rel="nofollow sponsored noopener">查看商品</a></div></div></article>`}
  function cardOffer(x){return `<article class="card"><div class="cardrow"><div><div class="scope">${esc(x.scope)}</div><div class="date">${esc(x.start||'現在')} ～ ${esc(x.end||'依活動頁')}</div></div><div><div class="offer">${esc(x.benefit)}</div>${codeBox(x.code)}<div class="actions"><a class="btn" href="${esc(x.url)}" target="_blank" rel="nofollow sponsored noopener">查看優惠</a></div></div></div></article>`}
  function bindCopy(){document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.code);const t=b.textContent;b.textContent='已複製';setTimeout(()=>b.textContent=t,1000)}catch(e){prompt('複製折扣碼：',b.dataset.code)}})}
  Promise.all(['campaigns.json','products.json','credit-cards.json'].map(u=>fetch(u+'?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(u+' HTTP '+r.status);return r.json()})))
    .then(([c,p,k])=>{
      const campaigns=(c.items||[]).filter(active).sort((a,b)=>(b.priority||0)-(a.priority||0));
      const cg={};campaigns.forEach(x=>(cg[x.category]||(cg[x.category]=[])).push(x));
      document.getElementById('campaigns').innerHTML=Object.keys(cg).map(g=>`<div class="section">${esc(g)}</div>${cg[g].map(campaignCard).join('')}`).join('')||'<div class="empty">目前沒有可顯示的活動。</div>';
      const products=p.items||[],pg={};products.forEach(x=>(pg[x.category]||(pg[x.category]=[])).push(x));
      document.getElementById('products').innerHTML=Object.keys(pg).map(g=>`<div class="section">${esc(g)}</div><div class="grid">${pg[g].map(productCard).join('')}</div>`).join('')||'<div class="empty">目前沒有商品。</div>';
      const cards=(k.items||[]).filter(active);
      document.getElementById('cards').innerHTML=cards.map(cardOffer).join('')||'<div class="empty">目前沒有信用卡優惠。</div>';
      document.getElementById('updated').textContent='最後更新：'+String(c.updated_at||'—').replace('T',' ').replace('+08:00','');
      bindCopy();
    }).catch(e=>{console.error(e);document.querySelectorAll('.panel').forEach(x=>x.innerHTML='<div class="err">資料暫時讀取失敗，請稍後再試。</div>')});
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});
})();
</script>
</body>
</html>
