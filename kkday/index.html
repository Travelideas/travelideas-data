<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travelideas × KKday｜動態優惠預覽</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#19a7b4;--bg:#f7f9fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;line-height:1.7}
.wrap{max-width:920px;margin:0 auto;padding:28px 18px 60px}.head{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px}.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--brand);font-weight:700}.head h1{font-size:30px;line-height:1.3;margin:4px 0 8px}.head p{margin:0;color:#4b5563}.meta{font-size:13px;color:var(--muted);margin-top:10px}.statusbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:#fff}.section{font-size:21px;font-weight:800;margin:26px 0 10px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.title{font-size:20px;font-weight:800}.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;height:max-content}.date{font-size:14px;color:var(--muted);margin-top:4px}.offer{font-size:17px;margin-top:10px}.code{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;background:#fafafa;border:1px dashed #c7cdd4;border-radius:10px}.code b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em}.copy{margin-left:auto;border:0;border-radius:8px;padding:7px 10px;cursor:pointer}.note{font-size:14px;color:#4b5563;margin-top:10px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{display:inline-block;text-decoration:none;padding:9px 14px;border-radius:9px;border:1px solid #111;color:#111}.btn.primary{background:#111;color:#fff}.empty,.err{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:22px;color:var(--muted)}.foot{margin-top:24px;font-size:12px;color:var(--muted)}
@media(max-width:640px){.head h1{font-size:24px}.title{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="eyebrow">Travelideas Data Hub · Mirror</div>
    <h1>KKday 最新優惠動態預覽</h1>
    <p>這一頁直接讀取 <code>campaigns.json</code>。之後 Blogger 使用同一份資料，更新 JSON 後兩邊會一起變。</p>
    <div class="statusbar">
      <span class="pill">CID 5149</span>
      <span class="pill" id="count">讀取中</span>
      <span class="pill" id="updated">最後更新：—</span>
    </div>
  </header>
  <main id="app"><div class="empty">正在讀取最新 KKday 資料…</div></main>
  <div class="foot" id="source"></div>
</div>
<script>
(function(){
  const DATA_URL='campaigns.json';
  const app=document.getElementById('app');
  const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const start=s=>new Date(s+'T00:00:00+08:00');
  const end=s=>new Date(s+'T23:59:59+08:00');
  function status(x){const n=new Date();if(n<start(x.start))return'即將開始';if(n>end(x.end))return'已結束';return'進行中'}
  function card(x){
    const code=x.code?`<div class="code">折扣碼 <b>${esc(x.code)}</b><button class="copy" data-code="${esc(x.code)}">複製</button></div>`:'';
    return `<article class="card"><div class="top"><div><div class="title">${esc(x.title)}</div><div class="date">活動期間：${esc(x.start)} ～ ${esc(x.end)}</div></div><span class="badge">${esc(status(x))}</span></div><div class="offer">${esc(x.offer)}</div>${code}<div class="note">${esc(x.note||'')}</div><div class="actions"><a class="btn primary" href="${esc(x.affiliate_url)}" target="_blank" rel="nofollow sponsored noopener">立即前往 KKday</a><a class="btn" href="${esc(x.source_url)}" target="_blank" rel="noopener">查看資料來源</a></div></article>`;
  }
  fetch(DATA_URL+'?t='+Date.now(),{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(data=>{
      const items=(data.items||[]).slice().sort((a,b)=>(b.priority||0)-(a.priority||0));
      document.getElementById('count').textContent=items.length+' 筆活動';
      document.getElementById('updated').textContent='最後更新：'+(data.updated_at||'—');
      const groups={};items.forEach(x=>(groups[x.category]||(groups[x.category]=[])).push(x));
      app.innerHTML=Object.keys(groups).map(k=>`<div class="section">${esc(k)}</div>${groups[k].map(card).join('')}`).join('')||'<div class="empty">目前沒有活動。</div>';
      document.getElementById('source').innerHTML=`來源：<a href="${esc(data.source?.url||'#')}" target="_blank" rel="noopener">${esc(data.source?.name||'KKpartners')}</a> · Source commit ${esc(data.source?.source_commit||'—')}`;
      document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.code);const t=b.textContent;b.textContent='已複製';setTimeout(()=>b.textContent=t,1000)}catch(e){prompt('複製折扣碼：',b.dataset.code)}});
    })
    .catch(e=>{console.error(e);app.innerHTML='<div class="err">資料讀取失敗，請檢查 campaigns.json 是否存在。</div>'});
})();
</script>
</body>
</html>
