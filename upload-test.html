<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Travelideas Upload API Test</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:760px;margin:40px auto;padding:0 18px;line-height:1.5}
    h1{font-size:24px}
    label{display:block;margin-top:16px;font-weight:600}
    input,textarea{width:100%;box-sizing:border-box;padding:10px;margin-top:6px;font:inherit}
    textarea{min-height:110px}
    button{margin-top:16px;padding:10px 16px;font:inherit;cursor:pointer}
    pre{white-space:pre-wrap;word-break:break-word;background:#f6f6f6;padding:14px;border-radius:8px;min-height:80px}
    .note{font-size:14px;color:#555}
  </style>
</head>
<body>
  <h1>Upload API 測試</h1>
  <p class="note">Token 只存在你目前這個瀏覽器頁面，不會寫進 GitHub。</p>

  <label>API URL</label>
  <input id="url" value="https://upload.travelideas.workers.dev/upload?name=test.txt" />

  <label>Authorization Token</label>
  <input id="token" type="password" placeholder="貼上 UPLOAD TOKEN（不要加 Bearer）" />

  <label>檔案內容</label>
  <textarea id="body">Hello</textarea>

  <button id="testRoot">測試 GET 根網址</button>
  <button id="upload">測試 PUT 上傳</button>

  <h2>結果</h2>
  <pre id="result">尚未測試</pre>

<script>
const result = document.getElementById('result');

async function showFetch(url, options) {
  result.textContent = '測試中...';
  try {
    const r = await fetch(url, options);
    const text = await r.text();
    const headers = [...r.headers.entries()].map(([k,v]) => k + ': ' + v).join('\n');
    result.textContent =
      'HTTP ' + r.status + ' ' + r.statusText + '\n\n' +
      headers + '\n\n' +
      text;
  } catch (e) {
    result.textContent =
      '瀏覽器請求失敗：\n' + e +
      '\n\n如果看到 CORS / Failed to fetch，表示 Worker 還需要允許 GitHub Pages 的跨網域請求。';
  }
}

document.getElementById('testRoot').addEventListener('click', async () => {
  await showFetch('https://upload.travelideas.workers.dev/', { method: 'GET' });
});

document.getElementById('upload').addEventListener('click', async () => {
  const url = document.getElementById('url').value.trim();
  const token = document.getElementById('token').value.trim();
  const body = document.getElementById('body').value;
  if (!url || !token) {
    result.textContent = '請先填 API URL 與 Token。';
    return;
  }
  await showFetch(url, {
    method: 'PUT',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'text/plain'
    },
    body
  });
});
</script>
</body>
</html>
