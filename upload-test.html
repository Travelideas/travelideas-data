<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Travelideas Upload API Test</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:760px;margin:40px auto;padding:0 18px;line-height:1.5}
    h1{font-size:24px}
    label{display:block;margin-top:16px;font-weight:600}
    input{width:100%;box-sizing:border-box;padding:10px;margin-top:6px;font:inherit}
    button{margin-top:16px;padding:10px 16px;font:inherit;cursor:pointer}
    pre{white-space:pre-wrap;word-break:break-word;background:#f6f6f6;padding:14px;border-radius:8px;min-height:80px}
    .note{font-size:14px;color:#555}
    .meta{margin-top:10px;font-size:14px;color:#444}
    .preview{margin-top:18px}
    .preview img{max-width:100%;height:auto;border:1px solid #ddd;border-radius:8px}
    .preview a{word-break:break-all}
  </style>
</head>
<body>
  <h1>Upload API 圖片上傳測試</h1>
  <p class="note">Token 只存在目前瀏覽器頁面，不會寫進 GitHub。</p>

  <label>API Base URL</label>
  <input id="baseUrl" value="https://upload.travelideas.workers.dev/upload" />

  <label>R2 公開網址</label>
  <input id="publicBaseUrl" value="https://pub-03ff9d78ceeb4b619df61d4bba53c9fb.r2.dev" />

  <label>Authorization Token</label>
  <input id="token" type="password" placeholder="貼上 UPLOAD TOKEN（不要加 Bearer）" />

  <label>選擇圖片</label>
  <input id="file" type="file" accept="image/*" />
  <div id="fileMeta" class="meta">尚未選擇圖片</div>

  <button id="testRoot">測試 GET 根網址</button>
  <button id="upload">上傳圖片到 R2</button>

  <h2>結果</h2>
  <pre id="result">尚未測試</pre>

  <div id="preview" class="preview" hidden>
    <h2>公開圖片</h2>
    <p><a id="publicLink" target="_blank" rel="noopener"></a></p>
    <img id="previewImage" alt="R2 圖片預覽" />
  </div>

<script>
const result = document.getElementById('result');
const fileInput = document.getElementById('file');
const fileMeta = document.getElementById('fileMeta');
const preview = document.getElementById('preview');
const publicLink = document.getElementById('publicLink');
const previewImage = document.getElementById('previewImage');

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
}

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  preview.hidden = true;
  if (!file) {
    fileMeta.textContent = '尚未選擇圖片';
    return;
  }
  fileMeta.textContent =
    '檔名：' + file.name +
    '｜類型：' + (file.type || '未知') +
    '｜大小：' + formatBytes(file.size);
});

async function showFetch(url, options) {
  result.textContent = '測試中...';
  try {
    const r = await fetch(url, options);
    const text = await r.text();
    const headers = [...r.headers.entries()].map(([k,v]) => k + ': ' + v).join('\n');
    result.textContent =
      'HTTP ' + r.status + ' ' + r.statusText + '\n\n' +
      headers + '\n\n' +
      text;
    return { response: r, text };
  } catch (e) {
    result.textContent =
      '瀏覽器請求失敗：\n' + e +
      '\n\n如果看到 CORS / Failed to fetch，表示 Worker 還需要允許 GitHub Pages 的跨網域請求。';
    return null;
  }
}

document.getElementById('testRoot').addEventListener('click', async () => {
  await showFetch('https://upload.travelideas.workers.dev/', { method: 'GET' });
});

document.getElementById('upload').addEventListener('click', async () => {
  const baseUrl = document.getElementById('baseUrl').value.trim().replace(/\/$/, '');
  const publicBaseUrl = document.getElementById('publicBaseUrl').value.trim().replace(/\/$/, '');
  const token = document.getElementById('token').value.trim();
  const file = fileInput.files[0];

  if (!baseUrl || !publicBaseUrl || !token) {
    result.textContent = '請先填 API URL、R2 公開網址與 Token。';
    return;
  }

  if (!file) {
    result.textContent = '請先選擇一張圖片。';
    return;
  }

  const uploadUrl = baseUrl + '?name=' + encodeURIComponent(file.name);

  const outcome = await showFetch(uploadUrl, {
    method: 'PUT',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': file.type || 'application/octet-stream'
    },
    body: file
  });

  if (!outcome || !outcome.response.ok) return;

  try {
    const data = JSON.parse(outcome.text);
    if (!data.success || !data.key) return;

    const publicUrl = publicBaseUrl + '/' + data.key.split('/').map(encodeURIComponent).join('/');
    publicLink.href = publicUrl;
    publicLink.textContent = publicUrl;
    previewImage.src = publicUrl + '?t=' + Date.now();
    preview.hidden = false;
  } catch (e) {
    // 上傳成功但回傳不是 JSON 時，不顯示預覽
  }
});
</script>
</body>
</html>
